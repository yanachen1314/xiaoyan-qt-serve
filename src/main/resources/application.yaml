# 自定义配置
xiaoyan:
  license:
    # 卡密加密密钥
    key: ${LICENSE_KEY}

spring:
  application:
    name: xiaoyanQt-serve
  profiles:
    active: dev
  servlet:
    multipart:
      # 单个文件的最大大小
      max-file-size: 15MB
      # 整个请求的最大大小（可以包含多个文件）
      max-request-size: 15MB
      enabled: true

server:
  # HTTP请求、响应头信息的最大大小
  port: 8080
  max-http-request-header-size: 102400

# ===================== mybatis-plus 配置 =======================
mybatis-plus:
  #  configuration:
  #配置日志
  #    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  #    log-impl: org.apache.ibatis.logging.log4j.Log4jImpl
  #指定xml的位置
  mapper-locations: classpath:mapper/**/*.xml
  # 配置别名包扫描路径
  #  type-aliases-package: com.yan.entity
  #  绑定Mybatis的配置文件,不能与configuration同时使用
  config-location: classpath:mybatis-config.xml
  global-config:
    banner: false
