
server:
  # HTTP请求、响应头信息的最大大小
  port: ${SERVER_PORT:8080}
  max-http-request-header-size: 102400

# ===================== spring 配置 =======================
spring:
  application:
    name: xiaoyanQt-serve
  profiles:
    active: dev
  servlet:
    multipart:
      # 单个文件的最大大小
      max-file-size: 15MB
      # 整个请求的最大大小（可以包含多个文件）
      max-request-size: 15MB
      enabled: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # ======= 系统邮箱配置 =======
  mail:
    host: smtp.qq.com
    username: 2742015729@qq.com
    password: gvbwhicjgyqvddfh
    port: 465
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

# ===================== mybatis-plus 配置 =======================
mybatis-plus:
  #  configuration:
  #配置日志
  #    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  #    log-impl: org.apache.ibatis.logging.log4j.Log4jImpl
  #指定xml的位置
  mapper-locations: classpath:mapper/**/*.xml
  # 配置别名包扫描路径
  #  type-aliases-package: com.yan.entity
  #  绑定Mybatis的配置文件,不能与configuration同时使用
  config-location: classpath:mybatis-config.xml
  global-config:
    banner: false

# ===================== 微信公众号配置 =======================
xiaoyan:
  wechat:
    # 微信公众号服务器配置 Token，生产环境建议通过 WECHAT_TOKEN 环境变量覆盖
    token: ${WECHAT_TOKEN:asdhjksfdgdfg}
    # 微信公众号 AppID，安全模式下用于校验解密消息归属
    app-id: ${WECHAT_APP_ID:}
    # 微信公众号 AppSecret，安全模式下用于获取访问令牌
    app-secret: ${WECHAT_APP_SECRET:}
    # 微信公众号 EncodingAESKey，安全模式下用于消息体加解密
    encoding-aes-key: ${WECHAT_ENCODING_AES_KEY:}
  tool-auth:
    code-expire-minutes: ${TOOL_AUTH_CODE_EXPIRE_MINUTES:5}
    token-expire-minutes: ${TOOL_AUTH_TOKEN_EXPIRE_MINUTES:10}
    token-uses: ${TOOL_AUTH_TOKEN_USES:1}
    verify-fail-limit: ${TOOL_AUTH_VERIFY_FAIL_LIMIT:5}
    verify-lock-minutes: ${TOOL_AUTH_VERIFY_LOCK_MINUTES:10}
  tools:
    doubao:
      base-url: ${DOUBAO_TOOL_BASE_URL:http://127.0.0.1:5000/api/doubao}
      connect-timeout-millis: ${DOUBAO_TOOL_CONNECT_TIMEOUT_MILLIS:5000}
      read-timeout-millis: ${DOUBAO_TOOL_READ_TIMEOUT_MILLIS:30000}
