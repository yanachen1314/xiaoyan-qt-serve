<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">验证成功 - 小烟改写工具</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image:linear-gradient(135deg,#C6F6D5 ,#BEE3F8 100%);
            font-family: Arial, 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 50px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .icon {
            font-size: 80px;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        h1 {
            color: #333333;
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            color: #666666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .email {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            color: #333333;
            margin: 20px 0;
        }

        .tip {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            color: #1976d2;
            margin-top: 20px;
            font-size: 14px;
        }

        .footer {
            margin-top: 30px;
            color: #999999;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="icon">✓</div>
    <h1>验证成功！</h1>
    <p>恭喜您，邮箱验证已成功完成。</p>
    <div class="email">卡密已发送到：<span th:text="${email}">example@example.com</span></div>
    <p>请检查您的邮箱收件箱，卡密已自动发送。</p>
    <div class="tip">
        <strong>提示：</strong>如果未收到邮件，请检查垃圾邮件文件夹，或稍后重新申请。
    </div>
    <div class="footer">
        <p>验证时间：<span th:text="${verifyTime}">2026-01-01 00:00:00</span></p>
        <p>© 2025 小烟改写工具. 保留所有权利.</p>
    </div>
</div>
</body>
</html>
