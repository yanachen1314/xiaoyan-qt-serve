<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">验证成功 - 小烟改写工具</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image:linear-gradient(135deg,#C6F6D5 ,#BEE3F8 100%);
            font-family: Arial, 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 50px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .icon {
            font-size: 80px;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        h1 {
            color: #333333;
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            color: #666666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .email {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            color: #333333;
            margin: 20px 0;
        }

        .license-key {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            margin: 25px 0;
            position: relative;
        }

        .license-key-label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin-bottom: 10px;
        }

        .license-key-value {
            background: rgba(255, 255, 255, 0.2);
            padding: 12px 16px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
            word-break: break-all;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            color: #ffffff;
            font-size: 13px;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.3s;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .copy-btn.copied {
            background: #4CAF50;
        }

        .tip {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            color: #1976d2;
            margin-top: 20px;
            font-size: 14px;
        }

        .footer {
            margin-top: 30px;
            color: #999999;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="icon">✓</div>
    <h1>验证成功！</h1>
    <p>恭喜您，邮箱验证已成功完成。</p>
    <div class="email">验证邮箱：<span th:text="${email}">example@example.com</span></div>
    <div class="license-key">
        <div class="license-key-label">您的专属密钥</div>
        <div class="license-key-value" id="licenseKey" th:text="${licenseKey}">XXXX-XXXX-XXXX-XXXX</div>
        <button class="copy-btn" onclick="copyKey()">复制密钥</button>
    </div>
    <div class="tip">
        <strong>提示：</strong>请妥善保管您的密钥，切勿泄露给他人。密钥可用于激活小烟改写工具的全部功能。
    </div>
    <div class="footer">
        <p>验证时间：<span th:text="${verifyTime}">2026-01-01 00:00:00</span></p>
        <p>© 2025 小烟改写工具. 保留所有权利.</p>
    </div>
</div>
<script>
function copyKey() {
    var keyText = document.getElementById('licenseKey').innerText;
    navigator.clipboard.writeText(keyText).then(function() {
        var btn = document.querySelector('.copy-btn');
        btn.innerText = '已复制';
        btn.classList.add('copied');
        setTimeout(function() {
            btn.innerText = '复制密钥';
            btn.classList.remove('copied');
        }, 2000);
    });
}
</script>
</body>
</html>
