<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证失败 - 小烟改写工具</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
            font-family: Arial, 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 50px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .icon {
            font-size: 80px;
            color: #f44336;
            margin-bottom: 20px;
        }

        h1 {
            color: #333333;
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            color: #666666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .error-box {
            background: #ffebee;
            padding: 20px;
            border-radius: 8px;
            color: #c62828;
            margin: 20px 0;
        }

        .button {
            display: inline-block;
            background: #409EFF;
            color: #ffffff;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            margin-top: 20px;
            font-weight: bold;
        }

        .button:hover {
            background: #3a8ee6;
        }

        .footer {
            margin-top: 30px;
            color: #999999;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="icon">✗</div>
    <h1 th:text="${title}">验证失败</h1>
    <div class="error-box">
        <span th:text="${message}">验证过程中发生错误，请稍后重试。</span>
    </div>
    <p>PS: 请尝试重新点击验证链接或重新申请，若问题依旧存在，请联系客服。</p>
    <a class="button" th:href="${websiteUrl}" href="#">前往官网</a>
    <div class="footer">
        <p>错误时间：<span th:text="${errorTime}">2026-01-01 00:00:00</span></p>
        <p>© 2025 小烟改写工具. 保留所有权利.</p>
    </div>
</div>
</body>
</html>
