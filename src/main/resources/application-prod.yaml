# ===================== 自定义配置 =======================
xiaoyan:
  webinfo:
    # 网站名称
    name: ${WEB_NAME:小烟改写工具}
    # 网站主站点
    main_site: ${WEB_MAIN_SITE:https://xygo.cn}
    # 网站后台管理系统
    admin_site: ${WEB_ADMIN_SITE:https://admin.xygo.cn}
    # 小烟改写工具 WEB端部署域名
    writer_site: ${WEB_WRITER_SITE:https://writer.xygo.cn}
    # 网站接口域名
    api_site: ${API_SITE:https://api.xygo.cn}
    # 商品购买地址
    ldxp_url: ${WEB_LDXP_URL:https://pay.ldxp.cn/shop/xiaoyanai}
  # 邮箱自定义配置
  mail:
    safety_limits:
      daily_total_max: ${LIMITS_DAILY_TOTAL_MAX:100}       # 日发送上限总额
      mail_daily_max: ${LIMITS_MAIL_DAILY_MAX:50}          # 单邮箱每天上限
      mail_minute_rate: ${LIMITS_MAIL_MINUTE_RATE:5}       # 单邮箱每分钟 5 封
      mail_bounce_rate: ${LIMITS_MAIL_BOUNCE_RATE:0.1}     # 单邮箱退信率 > 10% 立即禁用
    # 邮箱验证链接
    verify-link:
      # 链接长度
      token-length: ${VERIFY_LINK_LENGTH:128}
      # 链接有效期（天）
      expire_time: ${VERIFY_LINK_EXPIRE_TIME:3}
      # 链接校验基础路径
      base_path: ${VERIFY_LINK_BASE_PATH:/api/public/verifyEmailLink}
  # 安全配置
  security:
    # 卡密加密密钥
    license:
      key: ${LICENSE_KEY}
    # 业务数据加密配置
    biz-data:
      algorithm: ${ENCRYPT_ALGORITHM}
      encrypt-private-key: ${ENCRYPT_PRIVATE_KEY}
      encrypt-public-key: ${ENCRYPT_PUBLIC_KEY}

# 阿里云配置
aliyun:
  captcha:
    access-key-id: ${CAPTCHA_AK}
    access-key-secret: ${CAPTCHA_SK}
    endpoint: ${CAPTCHA_ENDPOINT}
    connect-timeout: ${CAPTCHA_CONNECT_TIMEOUT}
    read-timeout: ${CAPTCHA_READ_TIMEOUT}
    ekey: ${CAPTCHA_EKEY}

host:
  # 直接通过服务器本机访问：MySQL、Redis
  localhost: 127.0.0.1

spring:
  # ======================= 数据源配置 (开发环境) =======================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${host.localhost}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME} # 从环境变量获取
    password: ${MYSQL_PASSWORD} # 从环境变量获取
  data:
    # ===================== Redis 配置 (开发环境) =======================
    redis:
      host: ${host.localhost}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD} # 从环境变量获取
      database: 0
      timeout: 10000
      lettuce:
        pool:
          max-active: 10
          max-idle: 8
          min-idle: 2
          max-wait: 2000

  # ========= 邮箱配置 =========
  mail:
    properties:
      mail:
        debug: false # 关闭邮件调试
  # ===================== Thymeleaf 模板配置 (生产环境) =====================
  thymeleaf:
    cache: true # 生产环境开启缓存以提高性能
    encoding: UTF-8
    suffix: .html
    mode: HTML

# ===================== 日志配置 =======================
logging:
  level:
    com.yan.xiaoyanqtserve: info