# ===================== 自定义配置 =======================
xiaoyan:
  security:
    # 卡密加密密钥
    license:
      key: ${LICENSE_KEY}
    # 业务数据加密配置
    biz-data:
      algorithm: ${ENCRYPT_ALGORITHM}
      encrypt-private-key: ${ENCRYPT_PRIVATE_KEY}
      encrypt-public-key: ${ENCRYPT_PUBLIC_KEY}

    # 邮箱验证验证链接长度
    verify-link:
      length: ${VERIFY_LINK_LENGTH}
aliyun:
  captcha:
    access-key-id: ${CAPTCHA_AK}
    access-key-secret: ${CAPTCHA_SK}
    endpoint: captcha.cn-shanghai.aliyuncs.com
    connect-timeout: 5000
    read-timeout: 5000
    ekey: T72S75aYYm1+04XXvsyr7UwgAhKwnPUZ8yAobcowmmE=

host:
  # 直接通过服务器本机访问：MySQL、Redis
  localhost: 127.0.0.1

spring:
  # ======================= 数据源配置 (开发环境) =======================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${host.localhost}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME} # 从环境变量获取
    password: ${MYSQL_PASSWORD} # 从环境变量获取
  data:
    # ===================== Redis 配置 (开发环境) =======================
    redis:
      host: ${host.localhost}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD} # 从环境变量获取
      database: 0
      timeout: 10000
      lettuce:
        pool:
          max-active: 10
          max-idle: 8
          min-idle: 2
          max-wait: 2000

  # ========= 邮箱配置 =========
  mail:
    properties:
      mail:
        debug: false # 关闭邮件调试
  # ===================== Thymeleaf 模板配置 (生产环境) =====================
  thymeleaf:
    cache: true # 生产环境开启缓存以提高性能
    encoding: UTF-8
    suffix: .html
    mode: HTML

# ===================== 日志配置 =======================
logging:
  level:
    com.yan.xiaoyanqtserve: info