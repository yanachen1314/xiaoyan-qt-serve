# ===================== 自定义配置 =======================
xiaoyan:
  webinfo:
    # 网站名称
    name: ${WEB_NAME}
    # 网站主站点
    main_site: ${WEB_MAIN_SITE}
    # 网站后台管理系统
    admin_site: ${WEB_ADMIN_SITE}
    # 小烟改写工具 WEB端部署域名
    writer_site: ${WEB_WRITER_SITE}
    # 网站接口域名
    api_site: ${API_SITE}
    # 商品购买地址
    ldxp_url: ${WEB_LDXP_URL}
    # 网站备案号
    icp_record: ${ICP_RECORD}
  # 邮箱自定义配置
  mail:
    safety_limits:
      daily_total_max: ${LIMITS_DAILY_TOTAL_MAX}       # 日发送上限总额
      mail_daily_max: ${LIMITS_MAIL_DAILY_MAX}          # 单邮箱每天上限
      mail_minute_rate: ${LIMITS_MAIL_MINUTE_RATE}       # 单邮箱每分钟 5 封
      mail_bounce_rate: ${LIMITS_MAIL_BOUNCE_RATE}     # 单邮箱退信率 > 10% 立即禁用
    # 邮箱验证链接
    verify-link:
      # 链接长度
      token-length: ${VERIFY_LINK_LENGTH}
      # 链接有效期（天）
      expire_time: ${VERIFY_LINK_EXPIRE_TIME}
      # 链接校验基础路径
      base_path: ${VERIFY_LINK_BASE_PATH}
  # 安全配置
  security:
    # 卡密加密密钥
    license:
      key: ${LICENSE_KEY}
    # 业务数据加密配置
    biz-data:
      algorithm: ${ENCRYPT_ALGORITHM}
      encrypt-private-key: ${ENCRYPT_PRIVATE_KEY}
      encrypt-public-key: ${ENCRYPT_PUBLIC_KEY}

  # CORS 跨域配置（生产环境）
  cors:
    # 允许访问的源地址（多个域名用逗号分隔）
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:https://*.xygo.cn}
    # 允许的请求方法（多个方法用逗号分隔）
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    # 允许的请求头（多个头用逗号分隔）
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-API-Key,X-Device,X-Device-Id,X-Client-Version,X-Captcha-Verify-Params}
    # 暴露的响应头（多个头用逗号分隔）
    exposed-headers: ${CORS_EXPOSED_HEADERS:Authorization}
    # 预检请求缓存时间（秒）
    max-age: ${CORS_MAX_AGE:3600}
    # 是否允许携带 Cookie
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}

# 阿里云配置
aliyun:
  captcha:
    access-key-id: ${CAPTCHA_AK}
    access-key-secret: ${CAPTCHA_SK}
    endpoint: ${CAPTCHA_ENDPOINT}
    connect-timeout: ${CAPTCHA_CONNECT_TIMEOUT}
    read-timeout: ${CAPTCHA_READ_TIMEOUT}
    ekey: ${CAPTCHA_EKEY}


spring:
  # ======================= 数据源配置 (开发环境) =======================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME} # 从环境变量获取
    password: ${MYSQL_PASSWORD} # 从环境变量获取
  data:
    # ===================== Redis 配置 (开发环境) =======================
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD} # 从环境变量获取
      database: 0
      timeout: 10000
      lettuce:
        pool:
          max-active: 10
          max-idle: 8
          min-idle: 2
          max-wait: 2000

  # ========= 邮箱配置 =========
  mail:
    properties:
      mail:
        debug: false # 关闭邮件调试
  # ===================== Thymeleaf 模板配置 (生产环境) =====================
  thymeleaf:
    cache: true # 生产环境开启缓存以提高性能
    encoding: UTF-8
    suffix: .html
    mode: HTML

# ===================== 日志配置 =======================
logging:
  level:
    com.yan.xiaoyanqtserve: info