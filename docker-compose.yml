services:
  xiaoyanqt-server:
    image: "${ACR_IMAGE}:${IMAGE_TAG:-latest}"
    container_name: "${CONTAINER_NAME:-xiaoyanqt-server}"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - 1panel-network
    ports:
      - "${APP_PORT:-8080}:${SERVER_PORT:-8080}"

networks:
  1panel-network:
    external: true
    name: 1panel-network