# docker-compose.yml

services:
  xiaoyan-backend:
    image: xiaoyanqt-serve-1.0.0 # 指定构建后的镜像名称和标签
    container_name: xiaoyanqt-serve
    network_mode: "host" # 关键：使用 host 网络模式，容器内 localhost 指向宿主机
    env_file:
      - ./.env # 加载同目录下的 .env 文件
    restart: unless-stopped
    # 如果不使用 host 网络，需要映射端口以便 Nginx 代理
    # ports:
    #   - "8080:8080"