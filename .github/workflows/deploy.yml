name: 构建并推送 xiaoyanQT-server 镜像

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xiaoyanQT-server-build-and-push-master
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  # ACR 登录地址，不带协议
  ACR_REGISTRY: "crpi-g4udaemzizwlegm4.cn-shanghai.personal.cr.aliyuncs.com"
  # ACR 命名空间
  ACR_NAMESPACE: "xygo"
  # ACR 仓库名
  ACR_REPOSITORY: "xiaoyan_qt"
  # ACR 账号登录用户名
  ACR_USERNAME: "yanachen"
  # ACR 登录密码
  ACR_PASSWORD: "PKfy1314"

jobs:
  build-and-push:
    name: Maven 构建、Docker 构建并推送至阿里云 ACR
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # 当前镜像发布链路只负责编译打包；项目测试应在独立 CI 中执行。
      - name: Maven 编译打包
        run: mvn --batch-mode --update-snapshots -DskipTests clean package

      - name: 读取 Maven 项目版本
        id: project
        shell: bash
        run: |
          version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ -z "$version" ]]; then
            echo "Unable to read project.version from pom.xml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 部分阿里云 ACR 实例不支持 Buildx 默认生成的 OCI attestation manifest。
          provenance: false
          sbom: false
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_REPOSITORY }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_REPOSITORY }}:release-v${{ steps.project.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
